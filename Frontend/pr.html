<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PR - Procurement Department</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css"/>
  <link rel="stylesheet" href="css/pr.css"/>
  <link rel="stylesheet" href="css/toast.css"/>
</head>
<body>
  <div id="header"></div>
  <div class="layout">
    <div id="sidebar"></div>
    <main>
      <div class="page-header">
        <h1>Procurement Department</h1>
        <p class="subtitle">Recommendations & Approvals</p>
      </div>
      <section class="pr-section">
        <div class="section-header">
          <h2>Purchase Requisitions (PRs)</h2>
          <p class="description">Review and approve purchase requisitions before creating POs</p>
        </div>
        <ul id="pr-list" class="pr-list"></ul>
      </section>
    </main>
  </div>

  <script>
    async function load(){
      try {
        document.getElementById('header').innerHTML = await fetch('components/header.html').then(r=>r.text()).catch(e=>{console.error('Header load failed:', e); return '';});
        document.getElementById('sidebar').innerHTML = await fetch('components/sidebar.html').then(r=>r.text()).catch(e=>{console.error('Sidebar load failed:', e); return '';});
        const res = await fetch('/api/pr');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const prs = await res.json();
        document.getElementById('pr-list').innerHTML = prs.map(x=>{
          const status = x.status || 'pending';
          const statusClass = status === 'approved' ? 'approved' : status === 'rejected' ? 'rejected' : 'pending';
          let actions = `<button class="btn-recommend" onclick="recommend('${x.id}')">Recommend</button>`;
          if (status === 'approved') actions += ` <button class="btn-create-po" onclick="createPOfromPR('${x.id}')">Create PO</button>`;
          const shortId = x.id.substring(0,8).toUpperCase();
          return `
            <li class="pr-item pr-${statusClass}">
              <div class="pr-header">
                <div class="pr-id">PR #${shortId}</div>
                <span class="pr-status ${statusClass}">${status.toUpperCase()}</span>
              </div>
              <div class="pr-details">
                <div class="pr-item-name">${x.item}</div>
                <div class="pr-quantity">Qty: <strong>${x.qty}</strong></div>
              </div>
              <div class="pr-actions">
                ${actions}
              </div>
            </li>
          `;
        }).join('');
      } catch (err) {
        console.error('Error loading PRs:', err);
        document.getElementById('pr-list').innerHTML = '<li style="color:red;">Error loading PRs. Backend may not be running.</li>';
      }
    }
    async function recommend(id){
      try {
        const res = await fetch(`/api/pr/${id}/recommend`, {method:'POST'});
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(`HTTP ${res.status} ${txt}`);
        }
        const data = await res.json();
        showToast(data.message || 'PR recommended — transferred to Commercial', 'success');
        load();
      } catch (err) {
        console.error('Recommend error:', err);
        showToast('Failed to recommend PR: ' + err.message, 'error');
      }
    }
    
    // Create PO from PR (prompt for vendor and items)
    async function createPOfromPR(id){
      try{
        const vendor = prompt('Enter vendor ID for this PO (leave blank to set later):');
        const itemsStr = prompt('Enter items JSON for PO (e.g. [{"sku":"SKU-1","name":"Item","qty":1}])');
        let items = [];
        try{ if (itemsStr) items = JSON.parse(itemsStr); } catch(e){ showToast('Invalid JSON', 'error'); return; }
        const auto = confirm('Auto-complete entire workflow after creating PO? (this will create PO, receive, inspect, invoice and mark paid)');
        const payload = {vendor_id: vendor || null, items: items, total: 0, auto_full: auto};
        // Use the PR-specific create_po endpoint so PR status is updated and we get a workflow message
        const res = await fetch(`/api/pr/${id}/create_po`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(`HTTP ${res.status} ${txt}`);
        }
        const po = await res.json();
        // if automation ran, show the summary
        if (po.automation) {
          showToast((po.message || 'Auto workflow executed') + '\n' + JSON.stringify(po.automation, null, 2), 'success', 8000);
        } else {
          showToast(po.message || ('PO created: ' + (po.po_id || po.id)), 'success');
        }
        load();
      }catch(err){console.error('Create PO error', err); showToast('Failed to create PO', 'error');}
    }
    load();
  </script>
  <script src="js/toast.js"></script>
  <script src="js/pr.js"></script>
</body>
</html>
