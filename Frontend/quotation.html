<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Management | Procurement</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/toast.css">
    <style>
        .quotation-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            padding: 12px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .quotation-comparison {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .quotation-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            transition: all 0.3s ease;
        }

        .quotation-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .quotation-card.selected {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        .quote-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .vendor-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .quote-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-submitted {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-approved {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status-rejected {
            background: #ffebee;
            color: #d32f2f;
        }

        .quote-detail {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .quote-label {
            color: #666;
            font-size: 14px;
        }

        .quote-value {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .price-highlight {
            font-size: 20px;
            color: #667eea;
            font-weight: bold;
        }

        .quote-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .comparison-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .quote-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="quotation-container">
        <h1 class="section-title">📊 Quotation Management</h1>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="submit">Submit Quotation</button>
            <button class="tab" data-tab="compare">Compare Quotations</button>
            <button class="tab" data-tab="history">Quotation History</button>
        </div>

        <!-- Tab 1: Submit Quotation (Vendor) -->
        <div id="submit" class="tab-content active">
            <div class="form-card">
                <h2 style="margin-top: 0;">📝 Submit Your Quotation</h2>
                <form id="submitQuotationForm">
                    <div class="form-group">
                        <label for="orderId">Order ID *</label>
                        <select id="orderId" name="orderId" required>
                            <option value="">Select an order...</option>
                        </select>
                    </div>

                    <div id="orderDetails" style="display: none; background: #f9f9f9; padding: 15px; border-radius: 4px; margin-bottom: 20px;">
                        <p><strong>Required Items:</strong> <span id="orderDesc"></span></p>
                        <p><strong>Quantity:</strong> <span id="orderQty"></span></p>
                        <p><strong>Budget:</strong> <span id="orderBudget"></span></p>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="vendorId">Vendor ID/Name *</label>
                            <input type="text" id="vendorId" name="vendorId" placeholder="Your vendor ID" required>
                        </div>
                        <div class="form-group">
                            <label for="unitPrice">Unit Price (PKR) *</label>
                            <input type="number" id="unitPrice" name="unitPrice" min="0" step="0.01" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="totalPrice">Total Price (PKR) *</label>
                            <input type="number" id="totalPrice" name="totalPrice" min="0" step="0.01" readonly>
                        </div>
                        <div class="form-group">
                            <label for="deliveryDays">Delivery Days *</label>
                            <input type="number" id="deliveryDays" name="deliveryDays" min="1" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="notes">Additional Notes</label>
                        <textarea id="notes" name="notes" placeholder="Any special terms, warranty info, etc."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">📤 Submit Quotation</button>
                </form>
            </div>
        </div>

        <!-- Tab 2: Compare Quotations (Commercial) -->
        <div id="compare" class="tab-content">
            <div class="form-card">
                <h2 style="margin-top: 0;">🔍 Select Order to Compare Quotations</h2>
                <div class="form-group">
                    <label for="compareOrderId">Order ID *</label>
                    <select id="compareOrderId">
                        <option value="">Select an order...</option>
                    </select>
                </div>
            </div>

            <div id="quotationComparison" class="quotation-comparison"></div>
        </div>

        <!-- Tab 3: History -->
        <div id="history" class="tab-content">
            <div id="quotationHistory"></div>
        </div>
    </main>

    <script src="js/toast.js"></script>
    <script>
        fetch('components/header.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('header-placeholder').innerHTML = html;
            });

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                const tabId = e.target.dataset.tab;
                document.getElementById(tabId).classList.add('active');
            });
        });

        // Load orders for submit form
        async function loadOrdersForSubmit() {
            try {
                const response = await fetch('/api/orders/');
                const orders = await response.json();
                const select = document.getElementById('orderId');
                select.innerHTML = '<option value="">Select an order...</option>';
                orders.forEach(order => {
                    const option = document.createElement('option');
                    option.value = order.id;
                    option.textContent = `Order ${order.id} - ${order.client_name}`;
                    select.appendChild(option);
                });
            } catch (error) {
                showToast('Error loading orders: ' + error.message, 'error');
            }
        }

        // Show order details when selected
        document.getElementById('orderId').addEventListener('change', async (e) => {
            const orderId = e.target.value;
            if (orderId) {
                try {
                    const response = await fetch(`/api/orders/${orderId}`);
                    const order = await response.json();
                    document.getElementById('orderDesc').textContent = order.description;
                    document.getElementById('orderQty').textContent = order.quantity;
                    document.getElementById('orderBudget').textContent = `PKR ${order.total_budget}`;
                    document.getElementById('orderDetails').style.display = 'block';
                } catch (error) {
                    showToast('Error loading order details', 'error');
                }
            } else {
                document.getElementById('orderDetails').style.display = 'none';
            }
        });

        // Calculate total price
        const unitPriceInput = document.getElementById('unitPrice');
        const quantitySelect = document.getElementById('orderId');
        quantitySelect.addEventListener('change', updateTotalPrice);
        unitPriceInput.addEventListener('input', updateTotalPrice);

        async function updateTotalPrice() {
            const orderId = document.getElementById('orderId').value;
            if (orderId) {
                try {
                    const response = await fetch(`/api/orders/${orderId}`);
                    const order = await response.json();
                    const unitPrice = parseFloat(unitPriceInput.value) || 0;
                    const totalPrice = unitPrice * order.quantity;
                    document.getElementById('totalPrice').value = totalPrice.toFixed(2);
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        }

        // Submit quotation
        document.getElementById('submitQuotationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                order_id: document.getElementById('orderId').value,
                vendor_id: document.getElementById('vendorId').value,
                unit_price: parseFloat(document.getElementById('unitPrice').value),
                total_price: parseFloat(document.getElementById('totalPrice').value),
                delivery_days: parseInt(document.getElementById('deliveryDays').value),
                notes: document.getElementById('notes').value
            };

            try {
                const response = await fetch('/api/quotations/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (response.ok) {
                    showToast(result.message, 'success');
                    document.getElementById('submitQuotationForm').reset();
                    loadOrdersForSubmit();
                } else {
                    showToast('Error: ' + (result.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                showToast('Connection error: ' + error.message, 'error');
            }
        });

        // Compare quotations
        document.getElementById('compareOrderId').addEventListener('change', async (e) => {
            const orderId = e.target.value;
            const container = document.getElementById('quotationComparison');
            container.innerHTML = '';

            if (orderId) {
                try {
                    const response = await fetch(`/api/quotations/order/${orderId}`);
                    const quotations = await response.json();

                    if (quotations.length === 0) {
                        container.innerHTML = '<div class="empty-state"><p>No quotations received yet</p></div>';
                        return;
                    }

                    quotations.forEach(quote => {
                        const card = document.createElement('div');
                        card.className = 'quotation-card';
                        card.setAttribute('data-quote-id', quote.id);
                        card.innerHTML = `
                            <div class="quote-header">
                                <div>
                                    <div class="vendor-name">${quote.vendor_id}</div>
                                    <span class="quote-status status-${quote.status}">${quote.status}</span>
                                </div>
                            </div>
                            <div class="quote-detail">
                                <span class="quote-label">Unit Price:</span>
                                <span class="quote-value">PKR ${quote.unit_price.toLocaleString()}</span>
                            </div>
                            <div class="quote-detail">
                                <span class="quote-label">Total Price:</span>
                                <span class="quote-value price-highlight">PKR ${quote.total_price.toLocaleString()}</span>
                            </div>
                            <div class="quote-detail">
                                <span class="quote-label">Delivery:</span>
                                <span class="quote-value">${quote.delivery_days} days</span>
                            </div>
                            ${quote.notes ? `<div class="quote-detail"><span class="quote-label">Notes:</span></div><p style="font-size: 13px; color: #666;">${quote.notes}</p>` : ''}
                            <div class="quote-actions">
                                ${quote.status === 'submitted' ? `
                                    <button class="btn btn-success" onclick="approveQuote('${quote.id}')">✓ Approve</button>
                                    <button class="btn btn-danger" onclick="rejectQuote('${quote.id}')">✗ Reject</button>
                                ` : `
                                    <span style="padding: 8px 12px; border-radius: 4px; background: ${quote.status === 'approved' ? '#d4edda' : '#f8d7da'}; color: ${quote.status === 'approved' ? '#155724' : '#721c24'}; font-weight: 600; font-size: 12px;">${quote.status.toUpperCase()}</span>
                                `}
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } catch (error) {
                    showToast('Error loading quotations', 'error');
                }
            }
        });

        // Load orders for comparison
        async function loadOrdersForCompare() {
            try {
                const response = await fetch('/api/orders/');
                const orders = await response.json();
                const select = document.getElementById('compareOrderId');
                select.innerHTML = '<option value="">Select an order...</option>';
                orders.forEach(order => {
                    const option = document.createElement('option');
                    option.value = order.id;
                    option.textContent = `Order ${order.id} - ${order.client_name}`;
                    select.appendChild(option);
                });
            } catch (error) {
                showToast('Error loading orders', 'error');
            }
        }

        // Approve quotation
        async function approveQuote(quoteId) {
            try {
                const response = await fetch(`/api/quotations/${quoteId}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                if (response.ok) {
                    showToast(result.message, 'success');
                    // Remove the card or update its status visually
                    const card = document.querySelector(`[data-quote-id="${quoteId}"]`);
                    if (card) {
                        card.remove();
                    }
                    // Reload the comparison to show updated statuses
                    setTimeout(() => {
                        document.getElementById('compareOrderId').dispatchEvent(new Event('change'));
                    }, 500);
                } else {
                    showToast('Error: ' + (result.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                showToast('Connection error: ' + error.message, 'error');
            }
        }

        // Reject quotation
        async function rejectQuote(quoteId) {
            try {
                const response = await fetch(`/api/quotations/${quoteId}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                if (response.ok) {
                    showToast(result.message, 'success');
                    // Remove the card or update its status visually
                    const card = document.querySelector(`[data-quote-id="${quoteId}"]`);
                    if (card) {
                        card.remove();
                    }
                    // Reload the comparison to show updated statuses
                    setTimeout(() => {
                        document.getElementById('compareOrderId').dispatchEvent(new Event('change'));
                    }, 500);
                } else {
                    showToast('Error: ' + (result.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                showToast('Connection error: ' + error.message, 'error');
            }
        }

        // Initialize
        loadOrdersForSubmit();
        loadOrdersForCompare();
    </script>
</body>
</html>
